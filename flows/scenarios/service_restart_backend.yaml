id: service_restart_backend
name: "Backend restarts, and the app comes back"
tags: [template, manual, services]
steps:
  - service_restart: "Storefront/Web"
  - wait_for_out: {target: "Storefront/Web", value: "HTTP service .+ running on .+:8069", timeout: 180000}
  - type: wait_for_service
    target: "Storefront/Web"
    timeout: 30000
  - wait_for_criterion: {target: "Storefront/Web", value: "Updated/Started"}
  - goto: "{{env.origin}}"
  - use: "auth.login"
  - assert_visible: "dashboard"
