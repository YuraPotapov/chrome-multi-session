# DEMO-526 access matrix - Analytics Guest WITHOUT appeal, on APP-DEV (role_analyst2).
# Dev twin of access_analyst2: same TEMU agent scoping as role_analyst but
# analyst_can_appeal = OFF, so on the SAME kind of appealable ticket (refused /
# compensation approved - the only states where the button could render) action_appeal must
# be HIDDEN. That state targeting is what makes the check decisive: on any other ticket the
# button is absent for both users anyway. Run by id on app-dev only (tags: manual).
id: access_analyst2_dev
name: "Access matrix (app-dev) - Analytics Guest, agent TEMU, cannot appeal"
tags: [DEMO-526, role:analyst2, access, manual]
steps:
  - use: access.open_app
  - assert_visible: menu_reclamations_analyst
  - assert_visible: menu_fines_analyst
  # Same scoping proof as the can-appeal twin.
  - goto: "{{env.origin}}/odoo/action-demo_reclamation_management.action_reclamation_analyst"
  - wait_for: list_view
  - type: assert_visible
    target: first_list_row
    timeout: 10000
  - type: assert_not_visible
    target: row_agent_not_temu
    timeout: 2500
  # The decisive difference to role_analyst: appeal button ABSENT on an appealable ticket.
  - click: open_appealable_row
  - wait_for: form_view
  - type: assert_not_visible      # readonly proof: no editable input/textarea in the sheet
    target: form_editable_field
    timeout: 2500
  - type: assert_not_visible
    target: btn_ticket_appeal
    timeout: 3000
  - type: assert_not_visible
    target: btn_ticket_make_decision
    timeout: 2500
