# DEMO-526 - Compensation Finance WITHOUT the compensation-type scoping pair.
#
# NOT WIRED IN ANYWHERE, deliberately. access_fin_comp is the scenario to run on
# every environment, dev included: its scoping assert was verified green on
# app-dev on 2026-07-28 (reports 20260728-124548, 20260728-215104), so a failure
# there is a PROVISIONING REGRESSION, not an env difference to design around.
#
# When the scoping assert fails, the cause is almost always an emptied "Allowed
# Compensation Types" list on the user: reclamation_compensation_finance_rule
# falls back to an EMPTY domain in that case, i.e. no filter at all, so the role
# sees every type. The same fail-open bit the fine side on 2026-07-28 (see the
# STATUS block in run_access_matrix.txt). Fix the user, do not weaken the test.
#
# Use this file only to prove the ROLE'S UI is otherwise intact while provisioning
# is known-broken and being fixed - never as dev's standing matrix entry, or the
# check that has now caught this twice stops running.
id: access_fin_comp_dev
name: "Compensation Finance - UI only, scoping NOT asserted (diagnostic)"
tags: [DEMO-526, role:fin_comp, diagnostic, manual]
steps:
  - use: access.open_app
  # 4.1 Only the Compensation section is visible. Structural - true on every env.
  - assert_visible: menu_compensation
  - type: assert_not_visible
    target: menu_reclamations
    timeout: 2500
  - type: assert_not_visible
    target: menu_fines
    timeout: 2500
  - type: assert_not_visible
    target: menu_reporting
    timeout: 2500
  - type: assert_not_visible
    target: menu_settings
    timeout: 2500
  # 4.2 The finance compensations list opens and has rows. WHICH types appear is
  # exactly what this file does not assert - that is check_fin_comp_scoping's job.
  - goto: "{{env.origin}}/odoo/action-demo_reclamation_management.action_compensation_finance"
  - wait_for: list_view
  - type: assert_visible
    target: first_list_row
    timeout: 10000
  # 4.3 Open a compensation: readonly form, no edit-actions, no ticket jump. The
  # readonly claim is structural (every input-capable field is o_readonly_modifier),
  # so no editable input/textarea renders regardless of which record opens.
  - click: first_list_row
  - wait_for: form_view
  - type: assert_not_visible      # readonly proof: no editable input/textarea in the sheet
    target: form_editable_field
    timeout: 2500
  - type: assert_not_visible
    target: btn_comp_mark_failed
    timeout: 2500
  - type: assert_not_visible
    target: btn_comp_change_type
    timeout: 2500
  - type: assert_not_visible
    target: btn_comp_open_ticket
    timeout: 2500
  # 4.5 Direct-URL to any ticket -> access denied (no ticket, no chatter).
  - use: access.deny_tickets
