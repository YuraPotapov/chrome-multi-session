# DEMO-526 access matrix - Fine Finance (log in as role_fin_fine). QA doc section 5.
id: access_fin_fine
name: "Access matrix - Fine Finance"
tags: [DEMO-526, role:fin_fine, access, template]   # template: excluded from --run-tests=all; run per-role by id / tag:access
steps:
  - use: access.open_app
  # 5.1 Only the Fines section is visible.
  - assert_visible: menu_fines
  - type: assert_not_visible
    target: menu_compensation
    timeout: 2500
  - type: assert_not_visible
    target: menu_reclamations
    timeout: 2500
  - type: assert_not_visible
    target: menu_reporting
    timeout: 2500
  - type: assert_not_visible
    target: menu_settings
    timeout: 2500
  # 5.2 Fines list: Branch fines present; Carrier fines NEVER render for this role
  # (allowed_fine_type_ids = Branch only) - env-agnostic type-scoping check.
  # Matched in the fine_type COLUMN and in both UI languages (row_fine_* in selectors.yaml):
  # a whole-row match would also hit the Department/Customer columns, and the English labels
  # do not exist at all on a Ukrainian client ("Branch" renders as "Штраф підрозділу/філії").
  - goto: "{{env.origin}}/odoo/action-demo_reclamation_management.action_fines_restricted"
  - wait_for: list_view
  - type: assert_visible
    target: row_fine_branch
    timeout: 10000
  - type: assert_not_visible
    target: row_fine_carrier
    timeout: 2500
  # 5.3 Open a fine: form readonly. Distribute / Write Off / Review Appeal are hidden.
  # (Register Payment appears only once the fine is scheduled/partially - exercised by the
  #  write_fin_fine_register_payment scenario, not asserted here to stay state-independent.)
  - click: first_list_row
  - wait_for: form_view
  - type: assert_not_visible      # readonly proof: no editable input/textarea in the sheet
    target: form_editable_field
    timeout: 2500
  - type: assert_not_visible
    target: btn_fine_distribute_form
    timeout: 2500
  - type: assert_not_visible
    target: btn_fine_write_off
    timeout: 2500
  - type: assert_not_visible
    target: btn_fine_appeal_review
    timeout: 2500
  # 5.8 Direct-URL to any ticket -> access denied.
  - use: access.deny_tickets
